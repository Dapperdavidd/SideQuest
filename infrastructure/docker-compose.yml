services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sidequest
      POSTGRES_USER: sidequest
      POSTGRES_PASSWORD: sidequest
    ports:
      - "5432:5432"
    volumes:
      - sidequest_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidequest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sidequest_postgres:
