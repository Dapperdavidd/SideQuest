openapi: 3.1.0
info:
  title: SideQuest API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /organizations:
    post:
      summary: Create the authenticated user's owner-managed business profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Pending business profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "409":
          description: The owner already has a business profile or the slug is taken
        "422":
          description: Business identity or links are invalid
  /users/me/organization:
    get:
      summary: Get the authenticated user's business profile, including pending status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: The user has not created a business profile
  /organizations/{slug}:
    get:
      summary: Get a verified public business profile or the caller's own pending profile
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accessible business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Business profile is missing or not publicly verified
  /organizations/{organizationId}:
    patch:
      summary: Update an owner-managed business profile without changing verification state
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "200":
          description: Business profile updated
        "403":
          description: The authenticated user is not the owner
  /organizations/{organizationId}/analytics:
    get:
      summary: Get backend-derived activity and confirmed NIM totals for the owner
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Business activity derived from the owner's official quest records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorAnalytics"
        "403":
          description: The authenticated user is not the owner
  /users/me:
    get:
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated profile
        "401":
          description: Missing, invalid, or expired access token
    patch:
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The updated profile
        "409":
          description: Username is already taken
        "422":
          description: Profile fields are invalid
  /users/me/creator-analytics:
    get:
      summary: Get authoritative analytics for quests created by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Aggregate creator activity and confirmed NIM payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorAnalytics"
        "401":
          description: Missing, invalid, or expired access token
  /users/{username}:
    get:
      summary: Get a public profile by username
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile
        "404":
          description: Profile not found
  /users/{username}/achievements:
    get:
      summary: Get server-derived achievement progress for a public profile
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Achievement progress derived from official quest and social records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"
        "404":
          description: Profile not found
  /users/{userId}/follow-state:
    get:
      summary: Check whether the authenticated user follows another user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current follow state
  /users/{userId}/follow:
    post:
      summary: Follow a user idempotently
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User is followed
        "404":
          description: User not found
        "409":
          description: Users cannot follow themselves
    delete:
      summary: Stop following a user idempotently
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User is not followed
  /users/{userId}/block-state:
    get:
      summary: Check whether the authenticated user blocked another user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current block state
  /users/{userId}/block:
    post:
      summary: Block a user and remove follows in both directions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User is blocked
        "404":
          description: User not found
        "409":
          description: Users cannot block themselves
    delete:
      summary: Unblock a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User is unblocked
  /users/{userId}/followers:
    get:
      summary: List a user's followers
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public follower profiles, newest first
  /users/{userId}/following:
    get:
      summary: List profiles a user follows
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public followed profiles, newest first
  /users/me/quests:
    get:
      summary: List quests created or joined by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Related quests ordered by latest creation or publishing activity
        "401":
          description: Missing, invalid, or expired access token
  /users/me/saved-quests:
    get:
      summary: List public quests saved by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved quests ordered by most recently saved
        "401":
          description: Missing, invalid, or expired access token
  /users/me/notifications:
    get:
      summary: List the authenticated user's newest in-app notifications
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: unread_only
          schema:
            type: boolean
      responses:
        "200":
          description: Notifications ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          description: Missing, invalid, or expired access token
  /users/me/notifications/unread-count:
    get:
      summary: Count the authenticated user's unread notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current unread count
  /users/me/notifications/{notificationId}/read:
    post:
      summary: Mark one owned notification as read idempotently
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Notification marked read
        "404":
          description: Notification not found for this user
  /users/me/notifications/read-all:
    post:
      summary: Mark all owned notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Number of notifications updated
  /users/me/payout-destination:
    get:
      summary: Get the authenticated user's Nimiq testnet payout destination
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current payout destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutDestination"
        "404":
          description: No payout destination is configured
    put:
      summary: Validate and save the authenticated user's Nimiq testnet payout destination
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: string
      responses:
        "200":
          description: Normalized payout destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutDestination"
        "422":
          description: Address format or checksum is invalid
  /users/me/payouts:
    get:
      summary: List the authenticated user's NIM reward payouts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payouts ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayoutSummary"
        "401":
          description: Missing, invalid, or expired access token
  /quests:
    get:
      summary: Browse public quests
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - in: query
          name: search
          description: Case-insensitive title, description, or creator search.
          schema:
            type: string
            maxLength: 80
        - in: query
          name: quest_type
          description: Restrict discovery to one SideQuest experience.
          schema:
            type: string
            enum: [FRIENDS, BOUNTY, EXPLORE]
        - in: query
          name: latitude
          description: Viewer latitude for nearby discovery. Must be supplied with longitude.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - in: query
          name: longitude
          description: Viewer longitude for nearby discovery. Must be supplied with latitude.
          schema:
            type: number
            minimum: -180
            maximum: 180
        - in: query
          name: radius_km
          description: Maximum nearby distance in kilometres. Defaults to 25 when coordinates are supplied.
          schema:
            type: number
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Public quests ordered by publish time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quest"
    post:
      summary: Create an authenticated user's draft quest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuest"
      responses:
        "201":
          description: Draft created
        "401":
          description: Missing, invalid, or expired access token
        "422":
          description: Quest fields violate product rules
  /quests/{questId}:
    get:
      summary: Get a public quest, or an accessible private quest when authenticated
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Public quest details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "404":
          description: Quest is missing or inaccessible to the caller
  /quests/{questId}/saved:
    get:
      summary: Check whether the authenticated user saved a quest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Current saved state
    put:
      summary: Save a public quest idempotently
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Quest is saved
        "404":
          description: Quest is not publicly available
    delete:
      summary: Remove a quest from the authenticated user's saved list
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "204":
          description: Saved state removed or already absent
  /quests/{questId}/publish:
    post:
      summary: Publish a free quest or move a reward quest to awaiting funding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Updated quest
        "403":
          description: The authenticated user is not the creator
        "409":
          description: Quest cannot transition from its current state
        "422":
          description: Deadline has elapsed or a QR checkpoint quest has no stored checkpoints
  /quests/{questId}/join:
    post:
      summary: Join an open quest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "201":
          description: Membership created
        "409":
          description: Quest is closed, already joined, or owned by the user
        "404":
          description: Private quest access has not been granted by an invitation
  /quests/{questId}/checkpoints:
    get:
      summary: List ordered checkpoints visible to the caller
      description: Verification codes are included only when the authenticated caller created the quest.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Ordered checkpoints with caller-specific completion state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Checkpoint"
        "404":
          description: Quest is missing or inaccessible to the caller
    post:
      summary: Add a checkpoint to a creator-owned draft quest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckpoint"
      responses:
        "201":
          description: Checkpoint created with a private verification code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkpoint"
        "403":
          description: The authenticated user is not the creator
        "409":
          description: Quest is no longer a draft or already has twenty checkpoints
        "422":
          description: Checkpoint details are invalid
  /quests/{questId}/checkpoints/{checkpointId}:
    delete:
      summary: Delete a checkpoint from a creator-owned draft quest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
        - $ref: "#/components/parameters/CheckpointId"
      responses:
        "204":
          description: Checkpoint deleted
        "404":
          description: Checkpoint is missing or cannot be changed by the caller
  /quests/{questId}/checkpoints/{checkpointId}/complete:
    post:
      summary: Complete the next checkpoint using its private verification code
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
        - $ref: "#/components/parameters/CheckpointId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_code]
              properties:
                verification_code:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Idempotent checkpoint completion and aggregate progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckpointCompletion"
        "409":
          description: Quest is closed, caller has not joined, or an earlier checkpoint is incomplete
        "422":
          description: Verification code does not match
  /quests/{questId}/invitations:
    get:
      summary: List invitation links created for a private quest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Creator-owned invitations, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestInvitation"
        "403":
          description: The authenticated user is not the creator
    post:
      summary: Create a capacity-limited, expiring invitation for a private quest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_uses]
              properties:
                max_uses:
                  type: integer
                  minimum: 1
                  maximum: 10
                expires_at:
                  type: [string, "null"]
                  format: date-time
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestInvitation"
        "403":
          description: Caller is not the creator or the quest is public
        "409":
          description: Quest is not open
  /quests/{questId}/invitations/{invitationId}:
    delete:
      summary: Revoke a creator-owned invitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Invitation revoked
        "404":
          description: Invitation not found for this creator and quest
  /invitations/{token}/accept:
    post:
      summary: Accept a valid private-quest invitation and create membership
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation accepted, or membership already existed
        "404":
          description: Invitation token not found
        "409":
          description: Invitation expired, revoked, exhausted, or quest is no longer open
  /quests/{questId}/close:
    post:
      summary: Close an open quest to new submissions and begin creator review
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Quest is closed for review
        "403":
          description: The authenticated user is not the creator
        "409":
          description: Quest is not open
  /quests/{questId}/cancel:
    post:
      summary: Cancel a quest only while doing so cannot strand entries or reward funding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Quest is cancelled
        "403":
          description: The authenticated user is not the creator
        "409":
          description: Quest has entries, funding activity, or an ineligible lifecycle state
  /quests/{questId}/funding-intents:
    post:
      summary: Create or reuse a server-authoritative NIM funding intent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "201":
          description: Funding intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingIntent"
        "200":
          description: Existing unexpired funding intent returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingIntent"
        "403":
          description: The authenticated user is not the creator
        "409":
          description: Quest is not awaiting valid NIM funding
        "503":
          description: Nimiq funding configuration is incomplete
  /funding-intents/{intentId}:
    get:
      summary: Read an authenticated creator's funding intent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: intentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current funding intent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingIntent"
        "404":
          description: Intent is absent or does not belong to the caller
  /funding-intents/{intentId}/transactions:
    post:
      summary: Submit a Nimiq Pay transaction hash for independent verification
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: intentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_hash]
              properties:
                transaction_hash:
                  type: string
                  maxLength: 128
      responses:
        "200":
          description: Transaction accepted as pending or independently confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingVerificationResult"
        "409":
          description: Transaction is already assigned to another intent
        "422":
          description: Transaction is malformed or does not exactly match the intent
        "503":
          description: Nimiq verification is temporarily unavailable
  /funding-intents/{intentId}/refresh:
    post:
      summary: Refresh a submitted funding transaction from TestAlbatross
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: intentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Latest independently verified transaction and intent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingVerificationResult"
  /quests/{questId}/entries:
    get:
      summary: List submissions and evidence for the quest creator
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Ordered official entries with review state and evidence
        "403":
          description: The authenticated user is not the quest creator
    post:
      summary: Submit one immutable official entry with all required manual proof
      description: QR checkpoint proof is derived from authoritative participant progress and is never submitted as free text.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEntry"
      responses:
        "201":
          description: Entry and evidence accepted with a trusted timestamp
        "409":
          description: Membership, checkpoint progress, payout destination, deadline, capacity, duplicate, or quest status prevents acceptance
        "422":
          description: Caption or evidence is invalid
  /quests/{questId}/entries/{entryId}/review:
    post:
      summary: Mark an official entry valid or invalid
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
        - in: path
          name: entryId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_valid]
              properties:
                is_valid:
                  type: boolean
                reason:
                  type: [string, "null"]
                  maxLength: 500
      responses:
        "204":
          description: Review decision saved
        "409":
          description: Quest is not ready for review
  /quests/{questId}/finalize:
    post:
      summary: Lock winner selection and finalize a fully reviewed quest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                winner_entry_ids:
                  type: array
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Final winner positions and finalized status
        "409":
          description: Entries remain unreviewed, reward funding is unavailable, a payout snapshot is missing, or the quest is not reviewable
        "422":
          description: Winner selection violates the published method or count
  /quests/{questId}/settlement:
    get:
      summary: Read reward allocation and payout status as the quest creator
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Creator-visible settlement state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestSettlement"
        "403":
          description: The authenticated user is not the quest creator
        "404":
          description: Quest not found
  /quests/{questId}/winners:
    get:
      summary: List published winners for a finalized public quest
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Ordered public winners, or an empty list before finalization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicWinner"
  /quests/validate:
    post:
      summary: Validate immutable quest participation rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestRules"
      responses:
        "204":
          description: Rules are valid
        "422":
          description: Rules violate product limits
  /reports:
    post:
      summary: Submit an authenticated content-safety report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReport"
      responses:
        "201":
          description: Report added to the moderation queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentReport"
        "403":
          description: Users cannot report their own content
        "404":
          description: Report target not found
        "409":
          description: An active report already exists for this target
        "422":
          description: Report input is invalid
components:
  parameters:
    QuestId:
      in: path
      name: questId
      required: true
      schema:
        type: string
        format: uuid
    CheckpointId:
      in: path
      name: checkpointId
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      in: path
      name: organizationId
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrganizationInput:
      type: object
      required: [slug, display_name]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{2,39}$"
        display_name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: [string, "null"]
          minLength: 3
          maxLength: 500
        website_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
        logo_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
    Organization:
      allOf:
        - $ref: "#/components/schemas/OrganizationInput"
        - type: object
          required: [id, owner_id, owner_username, verification_status, created_at]
          properties:
            id:
              type: string
              format: uuid
            owner_id:
              type: string
              format: uuid
            owner_username:
              type: string
            verification_status:
              type: string
              enum: [PENDING, VERIFIED, REJECTED]
            verified_at:
              type: [string, "null"]
              format: date-time
            created_at:
              type: string
              format: date-time
    CreateCheckpoint:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 100
        instructions:
          type: [string, "null"]
          minLength: 2
          maxLength: 500
    Checkpoint:
      type: object
      required: [id, quest_id, position, title]
      properties:
        id:
          type: string
          format: uuid
        quest_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
          maximum: 20
        title:
          type: string
        instructions:
          type: [string, "null"]
        verification_code:
          type: [string, "null"]
          format: uuid
          description: Present only for the quest creator.
        completed_at:
          type: [string, "null"]
          format: date-time
    CheckpointCompletion:
      type: object
      required: [checkpoint_id, completed_at, completed_count, total_count, quest_complete]
      properties:
        checkpoint_id:
          type: string
          format: uuid
        completed_at:
          type: string
          format: date-time
        completed_count:
          type: integer
          minimum: 1
        total_count:
          type: integer
          minimum: 1
        quest_complete:
          type: boolean
    CreatorAnalytics:
      type: object
      required: [active_quests, entries_received, valid_submissions, winners_selected, rewards_paid_minor]
      properties:
        active_quests:
          type: integer
          minimum: 0
        entries_received:
          type: integer
          minimum: 0
        valid_submissions:
          type: integer
          minimum: 0
        winners_selected:
          type: integer
          minimum: 0
        rewards_paid_minor:
          type: integer
          minimum: 0
    CreateReport:
      type: object
      required: [subject_type, target_id, reason]
      properties:
        subject_type:
          type: string
          enum: [QUEST, USER]
        target_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [SAFETY, SPAM, HARASSMENT, MISLEADING, INAPPROPRIATE, OTHER]
        details:
          type: [string, "null"]
          minLength: 3
          maxLength: 500
    ContentReport:
      type: object
      required: [id, subject_type, reason, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        subject_type:
          type: string
          enum: [QUEST, USER]
        quest_id:
          type: [string, "null"]
          format: uuid
        user_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: string
          enum: [SAFETY, SPAM, HARASSMENT, MISLEADING, INAPPROPRIATE, OTHER]
        details:
          type: [string, "null"]
        status:
          type: string
          enum: [OPEN, REVIEWING, RESOLVED, DISMISSED]
        created_at:
          type: string
          format: date-time
    PayoutDestination:
      type: object
      required: [network, address, updated_at]
      properties:
        network:
          type: string
          enum: [testnet]
        address:
          type: string
          description: Checksum-validated Nimiq address normalized into four-character groups
        updated_at:
          type: string
          format: date-time
    PayoutSummary:
      type: object
      required:
        - id
        - quest_id
        - quest_title
        - amount_luna
        - amount_nim
        - status
        - network
        - destination_address
        - created_at
      properties:
        id:
          type: string
          format: uuid
        quest_id:
          type: string
          format: uuid
        quest_title:
          type: string
        amount_luna:
          type: integer
          minimum: 1
        amount_nim:
          type: string
          description: Exact decimal NIM representation derived from Luna
        status:
          type: string
          enum: [PENDING, SUBMITTED, CONFIRMED, FAILED]
        network:
          type: string
          enum: [testnet]
        destination_address:
          type: string
        transaction_hash:
          type: [string, "null"]
        submitted_at:
          type: [string, "null"]
          format: date-time
        confirmed_at:
          type: [string, "null"]
          format: date-time
        failure_reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    QuestSettlement:
      type: object
      required:
        - quest_id
        - status
        - reward_enabled
        - total_allocated_luna
        - total_allocated_nim
        - payouts
      properties:
        quest_id:
          type: string
          format: uuid
        status:
          type: string
        reward_enabled:
          type: boolean
        total_allocated_luna:
          type: integer
          minimum: 0
        total_allocated_nim:
          type: string
        payouts:
          type: array
          items:
            $ref: "#/components/schemas/CreatorPayout"
    CreatorPayout:
      type: object
      required:
        - id
        - winner_position
        - recipient_username
        - recipient_display_name
        - amount_luna
        - amount_nim
        - network
        - destination_address
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        winner_position:
          type: integer
          minimum: 1
          maximum: 3
        recipient_username:
          type: string
        recipient_display_name:
          type: string
        amount_luna:
          type: integer
          minimum: 1
        amount_nim:
          type: string
        network:
          type: string
          enum: [testnet]
        destination_address:
          type: string
        status:
          type: string
          enum: [PENDING, SUBMITTED, CONFIRMED, FAILED]
        transaction_hash:
          type: [string, "null"]
        submitted_at:
          type: [string, "null"]
          format: date-time
        confirmed_at:
          type: [string, "null"]
          format: date-time
        failure_reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    PublicWinner:
      type: object
      required:
        - winner_position
        - participant_username
        - participant_display_name
        - entry_id
      properties:
        winner_position:
          type: integer
          minimum: 1
          maximum: 3
        participant_username:
          type: string
        participant_display_name:
          type: string
        participant_avatar_url:
          type: [string, "null"]
        entry_id:
          type: string
          format: uuid
    FundingIntent:
      type: object
      required:
        - id
        - quest_id
        - amount_luna
        - amount_nim
        - status
        - network
        - treasury_address
        - payment_reference
        - minimum_confirmations
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        quest_id:
          type: string
          format: uuid
        amount_luna:
          type: integer
          minimum: 1
        amount_nim:
          type: string
        status:
          type: string
          enum: [CREATED, PENDING, CONFIRMED, FAILED, EXPIRED]
        network:
          type: string
          enum: [testnet]
        treasury_address:
          type: string
        payment_reference:
          type: string
          maxLength: 64
        minimum_confirmations:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    FundingVerificationResult:
      type: object
      required: [intent, transaction, quest_opened]
      properties:
        intent:
          $ref: "#/components/schemas/FundingIntent"
        transaction:
          type: object
          required:
            - transaction_hash
            - state
            - sender
            - recipient
            - value_luna
            - reference
            - network
            - confirmations
          properties:
            transaction_hash:
              type: string
            state:
              type: string
              enum: [new, pending, included, confirmed, invalidated, expired]
            sender:
              type: string
            recipient:
              type: string
            value_luna:
              type: integer
            reference:
              type: string
            network:
              type: string
            confirmations:
              type: integer
            block_height:
              type: [integer, "null"]
        quest_opened:
          type: boolean
    CreateQuest:
      type: object
      required:
        - title
        - description
        - quest_type
        - max_entries
        - winner_count
        - winner_selection_method
        - proof_requirements
        - reward_enabled
        - deadline
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 2000
        organization_id:
          type: [string, "null"]
          format: uuid
          description: A verified business profile owned by the creator; null for personal quests.
        cover_media_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
        location_name:
          type: [string, "null"]
          minLength: 2
          maxLength: 120
        latitude:
          type: [number, "null"]
          minimum: -90
          maximum: 90
        longitude:
          type: [number, "null"]
          minimum: -180
          maximum: 180
        quest_type:
          type: string
          enum: [FRIENDS, BOUNTY, EXPLORE]
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE, INVITE_ONLY]
          default: PUBLIC
        is_group_challenge:
          type: boolean
          default: false
        required_group_size:
          type: [integer, "null"]
          minimum: 2
          maximum: 50
        group_instructions:
          type: [string, "null"]
          minLength: 3
          maxLength: 500
          description: Required when is_group_challenge is true and null otherwise.
        max_entries:
          type: integer
          minimum: 1
          maximum: 10
        winner_count:
          type: integer
          minimum: 1
          maximum: 3
        winner_selection_method:
          type: string
          enum: [FIRST_VALID, BEST_SUBMISSION]
        proof_requirements:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum: [PHOTO, VIDEO, LINK, TEXT, QR_CHECKPOINT, LOCATION]
        judging_criteria:
          type: [string, "null"]
          maxLength: 500
        reward_enabled:
          type: boolean
        reward_amount_minor:
          type: [integer, "null"]
          minimum: 1
        reward_currency:
          type: [string, "null"]
          enum: [NIM, null]
        settlement_asset:
          type: [string, "null"]
          enum: [NIM, null]
        deadline:
          type: string
          format: date-time
    Quest:
      allOf:
        - $ref: "#/components/schemas/CreateQuest"
        - type: object
          required:
            - id
            - creator_id
            - creator_username
            - creator_display_name
            - visibility
            - status
            - entries_received
            - participants_joined
            - created_at
          properties:
            id:
              type: string
              format: uuid
            creator_id:
              type: string
              format: uuid
            creator_username:
              type: string
            creator_display_name:
              type: string
            creator_avatar_url:
              type: [string, "null"]
            organization_slug:
              type: [string, "null"]
            organization_display_name:
              type: [string, "null"]
            status:
              type: string
              enum: [DRAFT, AWAITING_FUNDING, OPEN, CLOSED_FOR_REVIEW, REVIEWING, FINALIZED, CANCELLED, SUSPENDED]
            entries_received:
              type: integer
            participants_joined:
              type: integer
            viewer_joined:
              type: boolean
            distance_km:
              type: [number, "null"]
              minimum: 0
              description: Great-circle distance from supplied discovery coordinates; null otherwise.
            created_at:
              type: string
              format: date-time
            published_at:
              type: [string, "null"]
              format: date-time
    QuestInvitation:
      type: object
      required: [id, quest_id, token, max_uses, use_count, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        quest_id:
          type: string
          format: uuid
        token:
          type: string
          format: uuid
        max_uses:
          type: integer
          minimum: 1
          maximum: 10
        use_count:
          type: integer
          minimum: 0
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    Notification:
      type: object
      required: [id, kind, title, body, href, created_at]
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: [string, "null"]
          format: uuid
        quest_id:
          type: [string, "null"]
          format: uuid
        kind:
          type: string
          enum: [NEW_FOLLOWER, QUEST_JOINED, ENTRY_SUBMITTED, ENTRY_APPROVED, ENTRY_REJECTED, QUEST_WON, QUEST_FINALIZED, PAYOUT_CONFIRMED, PAYOUT_FAILED]
        title:
          type: string
        body:
          type: string
        href:
          type: string
        read_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    Achievement:
      type: object
      required: [code, title, description, current, target, unlocked]
      properties:
        code:
          type: string
          enum: [FIRST_QUEST, QUEST_MAKER, CHAMPION, COMMUNITY_BUILDER]
        title:
          type: string
        description:
          type: string
        current:
          type: integer
          minimum: 0
        target:
          type: integer
          minimum: 1
        unlocked:
          type: boolean
    SubmitEntry:
      type: object
      required: [evidence]
      properties:
        caption:
          type: [string, "null"]
          maxLength: 280
        evidence:
          type: array
          description: Exactly the published non-QR proof types. May be empty for a checkpoint-only quest after all stops are complete.
          maxItems: 5
          uniqueItems: true
          items:
            type: object
            required: [proof_type, value]
            properties:
              proof_type:
                type: string
                enum: [PHOTO, VIDEO, LINK, TEXT, LOCATION]
              value:
                type: string
                minLength: 1
                maxLength: 2048
    QuestRules:
      type: object
      required: [max_entries, winner_count, winner_selection_method]
      properties:
        max_entries:
          type: integer
          minimum: 1
          maximum: 10
        winner_count:
          type: integer
          minimum: 1
          maximum: 3
        winner_selection_method:
          type: string
          enum: [FIRST_VALID, BEST_SUBMISSION]
