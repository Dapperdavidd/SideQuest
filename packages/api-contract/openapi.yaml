openapi: 3.1.0
info:
  title: SideQuest API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /users/me:
    get:
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated profile
        "401":
          description: Missing, invalid, or expired access token
    patch:
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The updated profile
        "409":
          description: Username is already taken
        "422":
          description: Profile fields are invalid
  /users/{username}:
    get:
      summary: Get a public profile by username
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile
        "404":
          description: Profile not found
  /users/me/quests:
    get:
      summary: List quests created or joined by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Related quests ordered by latest creation or publishing activity
        "401":
          description: Missing, invalid, or expired access token
  /users/me/payout-destination:
    get:
      summary: Get the authenticated user's Nimiq testnet payout destination
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current payout destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutDestination"
        "404":
          description: No payout destination is configured
    put:
      summary: Validate and save the authenticated user's Nimiq testnet payout destination
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: string
      responses:
        "200":
          description: Normalized payout destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutDestination"
        "422":
          description: Address format or checksum is invalid
  /quests:
    get:
      summary: Browse public quests
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Public quests ordered by publish time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quest"
    post:
      summary: Create an authenticated user's draft quest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuest"
      responses:
        "201":
          description: Draft created
        "401":
          description: Missing, invalid, or expired access token
        "422":
          description: Quest fields violate product rules
  /quests/{questId}:
    get:
      summary: Get a public quest
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Public quest details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "404":
          description: Quest is missing or not public
  /quests/{questId}/publish:
    post:
      summary: Publish a free quest or move a reward quest to awaiting funding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Updated quest
        "403":
          description: The authenticated user is not the creator
        "409":
          description: Quest cannot transition from its current state
        "422":
          description: Deadline has elapsed
  /quests/{questId}/join:
    post:
      summary: Join an open quest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "201":
          description: Membership created
        "409":
          description: Quest is closed, already joined, or owned by the user
  /quests/{questId}/funding-intents:
    post:
      summary: Create or reuse a server-authoritative NIM funding intent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "201":
          description: Funding intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingIntent"
        "200":
          description: Existing unexpired funding intent returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingIntent"
        "403":
          description: The authenticated user is not the creator
        "409":
          description: Quest is not awaiting valid NIM funding
        "503":
          description: Nimiq funding configuration is incomplete
  /funding-intents/{intentId}:
    get:
      summary: Read an authenticated creator's funding intent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: intentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current funding intent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingIntent"
        "404":
          description: Intent is absent or does not belong to the caller
  /funding-intents/{intentId}/transactions:
    post:
      summary: Submit a Nimiq Pay transaction hash for independent verification
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: intentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_hash]
              properties:
                transaction_hash:
                  type: string
                  maxLength: 128
      responses:
        "200":
          description: Transaction accepted as pending or independently confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingVerificationResult"
        "409":
          description: Transaction is already assigned to another intent
        "422":
          description: Transaction is malformed or does not exactly match the intent
        "503":
          description: Nimiq verification is temporarily unavailable
  /funding-intents/{intentId}/refresh:
    post:
      summary: Refresh a submitted funding transaction from TestAlbatross
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: intentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Latest independently verified transaction and intent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingVerificationResult"
  /quests/{questId}/entries:
    get:
      summary: List submissions and evidence for the quest creator
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      responses:
        "200":
          description: Ordered official entries with review state and evidence
        "403":
          description: The authenticated user is not the quest creator
    post:
      summary: Submit one immutable official entry with all required proof
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEntry"
      responses:
        "201":
          description: Entry and evidence accepted with a trusted timestamp
        "409":
          description: Membership, payout destination, deadline, capacity, duplicate, or quest status prevents acceptance
        "422":
          description: Caption or evidence is invalid
  /quests/{questId}/entries/{entryId}/review:
    post:
      summary: Mark an official entry valid or invalid
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
        - in: path
          name: entryId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_valid]
              properties:
                is_valid:
                  type: boolean
                reason:
                  type: [string, "null"]
                  maxLength: 500
      responses:
        "204":
          description: Review decision saved
        "409":
          description: Quest is not ready for review
  /quests/{questId}/finalize:
    post:
      summary: Lock winner selection and finalize a fully reviewed quest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                winner_entry_ids:
                  type: array
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Final winner positions and finalized status
        "409":
          description: Entries remain unreviewed, reward funding is unavailable, a payout snapshot is missing, or the quest is not reviewable
        "422":
          description: Winner selection violates the published method or count
  /quests/validate:
    post:
      summary: Validate immutable quest participation rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestRules"
      responses:
        "204":
          description: Rules are valid
        "422":
          description: Rules violate product limits
components:
  parameters:
    QuestId:
      in: path
      name: questId
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PayoutDestination:
      type: object
      required: [network, address, updated_at]
      properties:
        network:
          type: string
          enum: [testnet]
        address:
          type: string
          description: Checksum-validated Nimiq address normalized into four-character groups
        updated_at:
          type: string
          format: date-time
    FundingIntent:
      type: object
      required:
        - id
        - quest_id
        - amount_luna
        - amount_nim
        - status
        - network
        - treasury_address
        - payment_reference
        - minimum_confirmations
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        quest_id:
          type: string
          format: uuid
        amount_luna:
          type: integer
          minimum: 1
        amount_nim:
          type: string
        status:
          type: string
          enum: [CREATED, PENDING, CONFIRMED, FAILED, EXPIRED]
        network:
          type: string
          enum: [testnet]
        treasury_address:
          type: string
        payment_reference:
          type: string
          maxLength: 64
        minimum_confirmations:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    FundingVerificationResult:
      type: object
      required: [intent, transaction, quest_opened]
      properties:
        intent:
          $ref: "#/components/schemas/FundingIntent"
        transaction:
          type: object
          required:
            - transaction_hash
            - state
            - sender
            - recipient
            - value_luna
            - reference
            - network
            - confirmations
          properties:
            transaction_hash:
              type: string
            state:
              type: string
              enum: [new, pending, included, confirmed, invalidated, expired]
            sender:
              type: string
            recipient:
              type: string
            value_luna:
              type: integer
            reference:
              type: string
            network:
              type: string
            confirmations:
              type: integer
            block_height:
              type: [integer, "null"]
        quest_opened:
          type: boolean
    CreateQuest:
      type: object
      required:
        - title
        - description
        - quest_type
        - max_entries
        - winner_count
        - winner_selection_method
        - proof_requirements
        - reward_enabled
        - deadline
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 2000
        cover_media_url:
          type: [string, "null"]
        quest_type:
          type: string
          enum: [FRIENDS, BOUNTY, EXPLORE]
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE, INVITE_ONLY]
          default: PUBLIC
        is_group_challenge:
          type: boolean
          default: false
        required_group_size:
          type: [integer, "null"]
          minimum: 2
          maximum: 50
        max_entries:
          type: integer
          minimum: 1
          maximum: 10
        winner_count:
          type: integer
          minimum: 1
          maximum: 3
        winner_selection_method:
          type: string
          enum: [FIRST_VALID, BEST_SUBMISSION]
        proof_requirements:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum: [PHOTO, VIDEO, LINK, TEXT, QR_CHECKPOINT, LOCATION]
        judging_criteria:
          type: [string, "null"]
          maxLength: 500
        reward_enabled:
          type: boolean
        reward_amount_minor:
          type: [integer, "null"]
          minimum: 1
        reward_currency:
          type: [string, "null"]
          enum: [NIM, null]
        settlement_asset:
          type: [string, "null"]
          enum: [NIM, null]
        deadline:
          type: string
          format: date-time
    Quest:
      allOf:
        - $ref: "#/components/schemas/CreateQuest"
        - type: object
          required:
            - id
            - creator_id
            - creator_username
            - creator_display_name
            - visibility
            - status
            - entries_received
            - participants_joined
            - created_at
          properties:
            id:
              type: string
              format: uuid
            creator_id:
              type: string
              format: uuid
            creator_username:
              type: string
            creator_display_name:
              type: string
            creator_avatar_url:
              type: [string, "null"]
            status:
              type: string
              enum: [DRAFT, AWAITING_FUNDING, OPEN, CLOSED_FOR_REVIEW, REVIEWING, FINALIZED, CANCELLED, SUSPENDED]
            entries_received:
              type: integer
            participants_joined:
              type: integer
            created_at:
              type: string
              format: date-time
            published_at:
              type: [string, "null"]
              format: date-time
    SubmitEntry:
      type: object
      required: [evidence]
      properties:
        caption:
          type: [string, "null"]
          maxLength: 280
        evidence:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: object
            required: [proof_type, value]
            properties:
              proof_type:
                type: string
                enum: [PHOTO, VIDEO, LINK, TEXT, QR_CHECKPOINT, LOCATION]
              value:
                type: string
                minLength: 1
                maxLength: 2048
    QuestRules:
      type: object
      required: [max_entries, winner_count, winner_selection_method]
      properties:
        max_entries:
          type: integer
          minimum: 1
          maximum: 10
        winner_count:
          type: integer
          minimum: 1
          maximum: 3
        winner_selection_method:
          type: string
          enum: [FIRST_VALID, BEST_SUBMISSION]
