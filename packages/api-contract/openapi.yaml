openapi: 3.1.0
info:
  title: SideQuest API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /users/me:
    get:
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated profile
        "401":
          description: Missing, invalid, or expired access token
    patch:
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The updated profile
        "409":
          description: Username is already taken
        "422":
          description: Profile fields are invalid
  /users/{username}:
    get:
      summary: Get a public profile by username
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile
        "404":
          description: Profile not found
  /quests:
    get:
      summary: Browse public quests
      responses:
        "200":
          description: Public quest summaries
  /quests/validate:
    post:
      summary: Validate immutable quest participation rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestRules"
      responses:
        "204":
          description: Rules are valid
        "422":
          description: Rules violate product limits
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    QuestRules:
      type: object
      required: [max_entries, winner_count, winner_selection_method]
      properties:
        max_entries:
          type: integer
          minimum: 1
          maximum: 10
        winner_count:
          type: integer
          minimum: 1
          maximum: 3
        winner_selection_method:
          type: string
          enum: [FIRST_VALID, BEST_SUBMISSION]
